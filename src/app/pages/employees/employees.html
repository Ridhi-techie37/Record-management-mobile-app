<h2>Employees</h2>

@if (loading) {
  <p>Loading...</p>
} @else if (error) {
  <p class="error">{{ error }}</p>
} @else {
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Emp Id</th>
          <th>Name</th>
          <th>Phone</th>
          <th>Email</th>
        </tr>
      </thead>
      <tbody>
        @for (emp of employees; track emp.empId) {
          <tr>
            <td>{{ emp.empId }}</td>
            <td>{{ emp.empName }}</td>
            <td>{{ emp.phoneNumber }}</td>
            <td>{{ emp.email }}</td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4">No employees found</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
