<h2>Departments</h2>

@if (loading) {
  <p>Loading...</p>
} @else if (error) {
  <p class="error">{{ error }}</p>
} @else {
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Department Name</th>
        </tr>
      </thead>
      <tbody>
        @for (dept of departments; track dept.id) {
          <tr>
            <td>{{ dept.id }}</td>
            <td>{{ dept.name }}</td>
          </tr>
        } @empty {
          <tr>
            <td colspan="2">No departments found</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
